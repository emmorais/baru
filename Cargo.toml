[package]
name = "baru"
version = "0.1.0"
edition = "2021"

[dependencies]
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
rustyline = "11"
colored = "2"
serde_json = "1"
hex = "0.4"
binius-field = { git = "https://github.com/binius-zk/binius64", rev = "de81069" }
binius-core = { git = "https://github.com/binius-zk/binius64", rev = "de81069" }
tfhe = { version = "1.6", features = ["integer"] }


[dev-dependencies]
tempfile = "3"
