[package]
name = "baru"
version = "0.1.0"
edition = "2021"
default-run = "baru"

[dependencies]
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
# End-to-end encryption for the p2p chat (pure Rust, no native toolchain).
x25519-dalek = { version = "2", features = ["static_secrets"] }
# Group operations for oblivious transfer (`src/ot/`): x25519 exposes only DH,
# and Chou-Orlandi needs point addition. Already in the tree transitively via
# the dalek crates above, so this pins no new code — only a direct path to it.
curve25519-dalek = "4"
chacha20poly1305 = "0.10"
# REST control plane (pure Rust async: tokio + axum).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
axum = "0.7"
rustyline = "11"
colored = "2"
serde_json = "1"
hex = "0.4"
binius-field = { git = "https://github.com/binius-zk/binius64", rev = "de81069" }
binius-core = { git = "https://github.com/binius-zk/binius64", rev = "de81069" }
tfhe = { version = "1.6", features = ["integer"] }
# Vendored + patched SEAL bindings for the CKKS backend
# (see third_party/sealy/BARU_PATCHES.md)
sealy = { path = "third_party/sealy" }

# Post-quantum TLS secure channels (opt-in; requires NASM + MSVC to build the
# aws-lc-rs backend). Enable with `--features pq-tls`.
rustls = { version = "0.23", optional = true }
rustls-post-quantum = { version = "0.2", optional = true }
rcgen = { version = "0.13", optional = true }

[features]
default = []
pq-tls = ["dep:rustls", "dep:rustls-post-quantum", "dep:rcgen"]

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

# Keep the vendored sealy crate out of the workspace so cargo fmt/clippy
# don't touch its (differently formatted) sources.
[workspace]
exclude = ["third_party/sealy"]
