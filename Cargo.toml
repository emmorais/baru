[package]
name = "baru"
version = "0.1.0"
edition = "2021"
default-run = "baru"

[dependencies]
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
# Long-term party identities, used by the optional PQ-TLS transports.
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
# Group operations for oblivious transfer (`src/ot/`) and DH-PSI (`src/psi/`):
# Chou-Orlandi needs point addition, not just DH.
curve25519-dalek = "4"
rustyline = "11"
colored = "2"
serde_json = "1"
hex = "0.4"
binius-field = { git = "https://github.com/binius-zk/binius64", rev = "de81069" }
binius-core = { git = "https://github.com/binius-zk/binius64", rev = "de81069" }
tfhe = { version = "1.6", features = ["integer"] }
# Vendored + patched SEAL bindings for the CKKS backend
# (see third_party/sealy/BARU_PATCHES.md)
sealy = { path = "third_party/sealy" }

# Post-quantum TLS secure channels (opt-in; requires NASM + MSVC to build the
# aws-lc-rs backend). Enable with `--features pq-tls`.
rustls = { version = "0.23", optional = true }
rustls-post-quantum = { version = "0.2", optional = true }
rcgen = { version = "0.13", optional = true }

[features]
default = []
pq-tls = ["dep:rustls", "dep:rustls-post-quantum", "dep:rcgen"]
# NTL+GMP polynomial multiplication (`src/fhe/ntl.rs`, `cpp/ntl_polymul.cpp`).
# Opt-in: needs a C++ toolchain plus NTL and GMP installed
# (macOS: `brew install ntl gmp`, Debian: `apt install libntl-dev libgmp-dev`).
ntl = []

[build-dependencies]
# Compiles the optional NTL shim; see build.rs. Cheap and inert when the
# `ntl` feature is off — build.rs returns immediately.
cc = "1"

[dev-dependencies]
tempfile = "3"

# Keep the vendored sealy crate out of the workspace so cargo fmt/clippy
# don't touch its (differently formatted) sources.
[workspace]
exclude = ["third_party/sealy"]
