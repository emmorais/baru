[package]
name = "baru"
version = "0.1.0"
edition = "2021"
default-run = "baru"

[dependencies]
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
# Long-term party identities, used by the optional PQ-TLS transports.
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
# Group operations for oblivious transfer (`src/ot/`) and DH-PSI (`src/psi/`):
# Chou-Orlandi needs point addition, not just DH.
curve25519-dalek = "4"
# Fixed-key block cipher for the garbling hash (`src/crypto/garbled.rs`).
# Already in the tree transitively, so this pins no new code — only a direct
# path to it. Compiles to AES-NI on x86 and the ARMv8 crypto extensions.
aes = "0.8"
rustyline = "11"
colored = "2"
serde_json = "1"
hex = "0.4"
binius-field = { git = "https://github.com/binius-zk/binius64", rev = "de81069" }
binius-core = { git = "https://github.com/binius-zk/binius64", rev = "de81069" }
# The actual proof system. Until 2026-07-31 only the two crates above were
# declared and neither was imported anywhere, while `src/zkp` shipped a
# placeholder that established no soundness (see tests/zkp_soundness.rs).
binius-frontend = { git = "https://github.com/binius-zk/binius64", rev = "de81069" }
binius-prover = { git = "https://github.com/binius-zk/binius64", rev = "de81069" }
binius-verifier = { git = "https://github.com/binius-zk/binius64", rev = "de81069" }
binius-transcript = { git = "https://github.com/binius-zk/binius64", rev = "de81069" }
tfhe = { version = "1.6", features = ["integer"] }
# Post-quantum TLS secure channels (opt-in; requires NASM + MSVC to build the
# aws-lc-rs backend). Enable with `--features pq-tls`.
rustls = { version = "0.23", optional = true }
rustls-post-quantum = { version = "0.2", optional = true }
rcgen = { version = "0.13", optional = true }

[features]
default = []
pq-tls = ["dep:rustls", "dep:rustls-post-quantum", "dep:rcgen"]

[dev-dependencies]
tempfile = "3"
